<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Physics / 近代物理實驗室</title>
    <link rel="stylesheet" href="/phylab/assets/css/main-style.css">
</head>
<body>

    <main class="landing-container">
        <header class="hero-section">
            <a href="/phylab/" class="back-home-link">← 首頁</a>

            <div class="brand-tag">MODERN LAB</div>
            <h1 class="main-title">近代物理實驗室</h1>
            <p class="sub-title">點擊下方實驗，跨越經典物理極限，探索微觀量子世界。</p>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜尋實驗（標題、關鍵字、標籤）..." autocomplete="off">
            </div>
        </header><div id="tagBar" class="tag-bar" style="display: none;"></div>

        <section class="experiment-grid">
            
            
            <a href="/phylab/experiments/12-photoelectric-effect/" class="exp-card"
               data-tags="量子現象"
               data-keywords="光電效應 光子 功函數 截止頻率 停止電壓 量子 愛因斯坦">
                <div class="card-number">
                    01
                </div>
                <div class="card-content">
                    <h3>🔬 光電效應</h3>
                    <p>探索光子能量、金屬功函數與光電流之間的量子關係，重現愛因斯坦的諾貝爾獎實驗。</p>
                </div>
                <div class="card-arrow">→</div>
            </a>
            
        </section>

        <div id="gridEmpty" class="no-result" style="display: none;">找不到符合的實驗</div>
    </main>

    <script>
        const searchInput = document.getElementById('searchInput');
        const tagBar      = document.getElementById('tagBar');
        const gridEmpty   = document.getElementById('gridEmpty');
        const cards       = Array.from(document.querySelectorAll('.exp-card'));
        const wideGrid    = window.matchMedia('(min-width: 768px)');

        let activeTag = null;

        function tagsOf(card) {
            return (card.dataset.tags || '').split(',').map(t => t.trim()).filter(Boolean);
        }

        // 建立每張卡片的可比對文字：標題 + 描述 + keywords + tags。
        // keywords 每個實驗檔都有寫，但 Liquid 從沒把它輸出到 DOM，所以分類頁
        // 以前搜「SHM」「虎克」「彈簧常數」都是 0 筆——而實驗室首頁有納入。
        // 這裡只算一次，之後每次按鍵不必重讀 DOM。
        cards.forEach(card => {
            const title = card.querySelector('h3');
            const desc  = card.querySelector('p');
            card.dataset.searchText = [
                title ? title.textContent : '',
                desc  ? desc.textContent  : '',
                card.dataset.keywords || '',
                card.dataset.tags || ''
            ].join(' ').toLowerCase();
        });

        // 標籤清單與計數直接從卡片掃出來，不另外維護一份資料
        const tagCounts = new Map();
        cards.forEach(card => {
            tagsOf(card).forEach(tag => tagCounts.set(tag, (tagCounts.get(tag) || 0) + 1));
        });

        function renderTagBar() {
            if (tagCounts.size < 2) return;   // 整個分類只有一種標籤時，chips 沒有意義

            const chips = Array.from(tagCounts.entries())
                .sort((a, b) => b[1] - a[1])   // 實驗多的標籤排前面
                .map(([tag, n]) =>
                    `<button type="button" class="tag-chip" data-tag="${tag}"
                             title="篩選：${tag}">${tag}<span class="tag-count">${n}</span></button>`
                ).join('');

            tagBar.innerHTML = '<span class="tag-bar-label">依主題篩選</span>' + chips;
            tagBar.style.display = '';

            tagBar.addEventListener('click', function (e) {
                const chip = e.target.closest('.tag-chip');
                if (!chip) return;
                const tag = chip.dataset.tag;
                activeTag = (activeTag === tag) ? null : tag;   // 再點一次 = 取消篩選
                applyFilters();
            });
        }

        // 篩選與搜尋是「且」的關係，統一在這裡決定誰顯示，避免兩處各自
        // hide/show 造成狀態不同步
        function applyFilters() {
            const query = searchInput.value.trim().toLowerCase();
            const terms = query ? query.split(/\s+/) : [];
            let shown = 0;

            tagBar.querySelectorAll('.tag-chip').forEach(chip => {
                chip.classList.toggle('active', chip.dataset.tag === activeTag);
            });

            cards.forEach(card => {
                const matchTag  = !activeTag || tagsOf(card).includes(activeTag);
                const matchText = terms.every(term => card.dataset.searchText.includes(term));

                card.style.display = (matchTag && matchText) ? '' : 'none';
                if (!(matchTag && matchText)) return;

                // 原本靠 :nth-child(2n) 拿掉每列第二張的右框，但 :nth-child 數的是
                // DOM 位置，篩選後會對不上，卡片之間會少一條線或多一條線。
                // 所以在雙欄模式下自己按「看得見的張數」重算。
                shown++;
                card.style.borderRight = wideGrid.matches
                    ? (shown % 2 === 0 ? 'none' : '2px solid #000000')
                    : '';
            });

            // 空狀態：顯示在 grid 的位置，而不是搜尋框底下的下拉——
            // 用 chip 篩選時使用者未必在看搜尋框
            gridEmpty.style.display = shown ? 'none' : 'block';
            if (!shown) {
                gridEmpty.textContent = activeTag && query
                    ? `找不到同時符合「${activeTag}」與「${query}」的實驗。點一下藍色標籤可取消篩選。`
                    : activeTag
                        ? `找不到標籤「${activeTag}」的實驗。`
                        : `找不到符合「${query}」的實驗。`;
            }

            // 讓篩選後的檢視可以直接分享：/phylab/mechanics/?tag=運動學
            const url = new URL(window.location.href);
            if (activeTag) url.searchParams.set('tag', activeTag);
            else           url.searchParams.delete('tag');
            history.replaceState(null, '', url);
        }

        renderTagBar();

        // 讀取分享連結裡的 ?tag=（標籤不存在就忽略，applyFilters 會把它從網址清掉）
        const initialTag = new URLSearchParams(window.location.search).get('tag');
        if (initialTag && tagCounts.has(initialTag)) activeTag = initialTag;

        searchInput.addEventListener('input', applyFilters);
        wideGrid.addEventListener('change', applyFilters);   // 跨過 768px 時重算邊框

        applyFilters();
    </script>

</body>
</html>
