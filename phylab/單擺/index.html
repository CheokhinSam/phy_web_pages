<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單擺的簡諧運動</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
MathJax = { tex: { inlineMath: [['$', '$']] }, startup: { typeset: false } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" async></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; height: 100vh; overflow: hidden; }

.lab-layout { display: grid; grid-template-columns: 260px 1fr 300px; height: 100vh; }

/* 左側控制面板 */
.lab-sidebar { background: #fff; border-right: 1px solid #e2e8f0; overflow-y: auto; padding: 20px 16px; }
.lab-sidebar h1 { font-size: 1.1rem; font-weight: 800; margin-bottom: 16px; }

.control-box { margin-bottom: 12px; }
.control-box label { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
.control-box input[type="range"] { width: 100%; accent-color: #2563eb; }

.control-box button {
    display: block; width: 100%; padding: 10px; border: none; font-weight: 700;
    cursor: pointer; font-size: 0.9rem; letter-spacing: 1px; border-radius: 4px;
}
#startBtn { background: #000; color: #fff; }
#pauseBtn { background: #fff; color: #000; border: 1px solid #000 !important; margin-top: 6px; display: none; }
#resetBtn { background: #fff; color: #000; border: 1px solid #000 !important; margin-top: 6px; }

/* 中央 Canvas */
.lab-canvas-area { position: relative; background: #f8fafc; display: flex; align-items: center; justify-content: center; }
#physicsCanvas { width: 100%; height: 100%; display: block; }

/* 右側數據面板 */
.lab-data { background: #fff; border-left: 1px solid #e2e8f0; overflow-y: auto; padding: 20px 16px; }
.lab-data h2 { font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }

.data-cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
.data-card {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px;
    text-align: center; transition: border-color 0.2s;
}
.data-card.highlight { border-color: #2563eb; }
.card-label { display: block; font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.card-num-wrapper { display: flex; align-items: baseline; justify-content: center; gap: 4px; }
.card-num { font-family: 'Inter', monospace; font-size: 1.3rem; font-weight: 800; color: #1e293b; }
.card-unit { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }

.chart-wrapper { position: relative; height: 200px; margin-bottom: 16px; }
.chart-wrapper canvas { width: 100% !important; height: 100% !important; }
.pane-meta-title { font-family: 'Inter', monospace; font-size: 0.7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

@media (max-width: 900px) {
    .lab-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    .lab-sidebar { border-right: none; border-bottom: 1px solid #e2e8f0; }
    .lab-data { border-left: none; border-top: 1px solid #e2e8f0; }
}
</style>
</head>
<body>

<div class="lab-layout">
    <!-- 左側控制面板 -->
    <div class="lab-sidebar">
        <h1>單擺的簡諧運動</h1>
        <div id="controlPanel"></div>
    </div>

    <!-- 中央 Canvas -->
    <div class="lab-canvas-area">
        <canvas id="physicsCanvas"></canvas>
    </div>

    <!-- 右側數據面板 -->
    <div class="lab-data">
        <h2>即時數據</h2>
        <div class="data-cards-grid"></div>
        <div id="chartContainer"></div>
    </div>
</div>

<script>
// =========================================================================
// PhysicsUtils (inlined)
// =========================================================================
const PhysicsUtils = {
    FONTS: {
        LABEL: '700 13px "Inter", monospace',
        LEGEND: '700 12px "Inter", sans-serif',
        SMALL: '600 11px "Inter", sans-serif',
        ANGLE: '600 12px "Inter", monospace',
    },

    scaled(px, W) { return px * (W / 800); },

    drawSafeText(ctx, text, x, y, opts = {}) {
        const W = opts.W, H = opts.H;
        const font = opts.font || PhysicsUtils.FONTS.LABEL;
        const color = opts.color || '#1e293b';
        const align = opts.align || 'left';
        const baseline = opts.baseline || 'alphabetic';
        const padding = opts.padding != null ? opts.padding : 4;
        ctx.save(); ctx.font = font; ctx.textAlign = align; ctx.textBaseline = baseline;
        const m = ctx.measureText(text), tw = m.width, th = parseFloat(font) || 13;
        let lx = x, ly = y;
        if (align === 'center') lx = x - tw / 2;
        else if (align === 'right') lx = x - tw;
        lx = Math.max(padding, Math.min(W - tw - padding, lx));
        ly = Math.max(padding + th, Math.min(H - padding, ly));
        if (opts.bg) { ctx.fillStyle = opts.bg; ctx.fillRect(lx - padding, ly - th - padding + 2, tw + padding * 2, th + padding * 2 - 2); }
        ctx.fillStyle = color; ctx.fillText(text, lx, ly); ctx.restore();
    },

    drawLegend(ctx, entries, W, H) {
        const legendW = 160, legendX = Math.max(10, W - legendW - 10), legendY = 14;
        ctx.save(); ctx.font = PhysicsUtils.FONTS.LEGEND; ctx.textAlign = 'left';
        entries.forEach((entry, i) => {
            const ey = legendY + i * 18;
            ctx.fillStyle = entry.color; ctx.fillRect(legendX, ey, 14, 3);
            ctx.fillStyle = '#1e293b'; ctx.fillText(entry.label, legendX + 20, ey + 5);
        });
        ctx.restore();
    },

    initCanvas() {
        const canvas = document.getElementById('physicsCanvas');
        if (!canvas) return null;
        const ctx = canvas.getContext('2d');
        const ctrlPanel = document.getElementById('controlPanel');
        const guardEl = ctrlPanel || canvas;
        return { canvas, ctx, ctrlPanel, guardEl };
    },

    setupResize(canvas) {
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.cssWidth = w;
            canvas.cssHeight = h;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        return resizeCanvas;
    },

    beginFrame(ctx, canvas) {
        const dpr = window.devicePixelRatio || 1;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, canvas.cssWidth, canvas.cssHeight);
    },

    setupCleanup(animationFrameId, resizeCanvas, onCleanup) {
        function cleanup() {
            cancelAnimationFrame(animationFrameId);
            window.removeEventListener('resize', resizeCanvas);
            if (onCleanup) onCleanup();
        }
        window.addEventListener('pagehide', cleanup);
    },

    drawArrow(ctx, x1, y1, x2, y2, opts = {}) {
        const color = opts.color || '#000000';
        const width = opts.width || 3;
        const dashed = opts.dashed || false;
        const shadow = opts.shadow || false;
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.sqrt(dx * dx + dy * dy);
        if (len < 2) return;
        ctx.save();
        if (shadow) { ctx.shadowColor = color; ctx.shadowBlur = 6; }
        ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
        if (dashed) ctx.setLineDash([6, 4]);
        const angle = Math.atan2(dy, dx);
        const headLen = Math.min(14, Math.max(8, len * 0.3));
        ctx.beginPath(); ctx.moveTo(x1, y1);
        ctx.lineTo(x2 - headLen * Math.cos(angle), y2 - headLen * Math.sin(angle));
        ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
        ctx.closePath(); ctx.fill();
        ctx.restore();
        if (opts.label) {
            ctx.save(); ctx.font = '700 13px "Inter", monospace'; ctx.fillStyle = color;
            const m = ctx.measureText(opts.label);
            ctx.fillText(opts.label, (x1 + x2) / 2 - m.width / 2, (y1 + y2) / 2 - 10);
            ctx.restore();
        }
    },

    drawBall(ctx, x, y, r, color, opts = {}) {
        const darkColor = opts.darkColor || PhysicsUtils._darken(color);
        const lightColor = opts.lightColor || PhysicsUtils._lighten(color);
        const strokeColor = opts.strokeColor || '#1e3a8a';
        const grad = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.1, x, y, r);
        grad.addColorStop(0, lightColor); grad.addColorStop(0.6, color); grad.addColorStop(1, darkColor);
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = grad; ctx.fill();
        ctx.strokeStyle = strokeColor; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(x - r * 0.25, y - r * 0.3, r * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
        if (opts.label) {
            ctx.fillStyle = '#ffffff'; ctx.font = `700 ${Math.max(10, r * 0.7)}px "Inter", sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(opts.label, x, y);
        }
    },

    _darken(hex) {
        const rgb = PhysicsUtils._hexToRgb(hex);
        return `rgb(${Math.max(0, rgb.r - 60)}, ${Math.max(0, rgb.g - 60)}, ${Math.max(0, rgb.b - 60)})`;
    },
    _lighten(hex) {
        const rgb = PhysicsUtils._hexToRgb(hex);
        return `rgb(${Math.min(255, rgb.r + 80)}, ${Math.min(255, rgb.g + 80)}, ${Math.min(255, rgb.b + 80)})`;
    },
    _hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 0, g: 0, b: 0 };
    },

    bindSlider(sliderId, valId, setter, formatter) {
        const slider = document.getElementById(sliderId);
        const valEl = document.getElementById(valId);
        if (!slider) return;
        const fmt = formatter || (v => parseFloat(v).toFixed(1));
        slider.addEventListener('input', function () {
            const v = parseFloat(this.value);
            setter(v);
            if (valEl) valEl.innerText = fmt(v);
        });
    },

    setupPauseBtn(btnId, stateObj, loopFn, onToggle) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        btn.addEventListener('click', () => {
            stateObj.isPaused = !stateObj.isPaused;
            btn.textContent = stateObj.isPaused ? '播放 PLAY' : '暫停 PAUSE';
            btn.style.backgroundColor = stateObj.isPaused ? '#2563eb' : '#ffffff';
            btn.style.color = stateObj.isPaused ? '#ffffff' : '#000000';
            btn.style.border = stateObj.isPaused ? 'none' : '1px solid #000000';
            if (!stateObj.isPaused) { stateObj.lastTimestamp = performance.now(); requestAnimationFrame(loopFn); }
            if (onToggle) onToggle(stateObj.isPaused);
        });
    },

    setupStartBtn(startBtnId, pauseBtnId, stateObj, onStart) {
        const startBtn = document.getElementById(startBtnId);
        const pauseBtn = document.getElementById(pauseBtnId);
        if (!startBtn) return;
        startBtn.addEventListener('click', () => {
            stateObj.isRunning = true; stateObj.isPaused = false;
            startBtn.style.display = 'none';
            if (pauseBtn) pauseBtn.style.display = 'block';
            if (onStart) onStart();
        });
    },

    setupResetBtn(btnId, resetFn) {
        const btn = document.getElementById(btnId);
        if (!btn) return;
        btn.addEventListener('click', resetFn);
    },

    createDataCards(cards) {
        const dataGrid = document.querySelector('.data-cards-grid');
        if (!dataGrid) return () => {};
        dataGrid.style.gridTemplateColumns = 'repeat(auto-fit, minmax(150px, 1fr))';
        dataGrid.innerHTML = cards.map(c => `
            <div class="data-card${c.highlight ? ' highlight' : ''}">
                <span class="card-label">${c.label}</span>
                <div class="card-num-wrapper">
                    <span id="${c.id}" class="card-num">0</span>
                    <span class="card-unit">${c.unit}</span>
                </div>
            </div>
        `).join('');
        return function updateCards(values) {
            for (const [id, val] of Object.entries(values)) {
                const el = document.getElementById(id);
                if (el) el.innerText = typeof val === 'number' ? val.toFixed(2) : val;
            }
        };
    },

    createChart(config) {
        const canvasEl = document.getElementById(config.canvasId);
        if (!canvasEl || typeof Chart === 'undefined') return null;
        const chart = new Chart(canvasEl, {
            type: config.type || 'line',
            data: {
                labels: [],
                datasets: [{
                    label: config.label, data: [],
                    borderColor: config.borderColor || '#2563eb',
                    borderWidth: config.borderWidth || 2.5,
                    pointRadius: 0, fill: false,
                    tension: config.tension !== undefined ? config.tension : 0.1
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: {
                    x: { title: { display: true, text: config.xTitle, font: { family: 'monospace', weight: '700' } }, grid: { display: false }, ticks: { font: { family: 'monospace' }, maxTicksLimit: 8 } },
                    y: { title: { display: true, text: config.yTitle, font: { family: 'monospace', weight: '700' } }, ticks: { font: { family: 'monospace' } } }
                },
                plugins: { legend: { display: false } }
            }
        });
        const maxPoints = config.maxPoints || 300;
        return {
            chart,
            pushData(t, v) {
                chart.data.labels.push(t); chart.data.datasets[0].data.push(v);
                if (chart.data.labels.length > maxPoints) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
                chart.update('none');
            },
            clear() { chart.data.labels = []; chart.data.datasets[0].data = []; chart.update(); }
        };
    },

    prepareChartContainer(containerId, charts) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.style.display = 'block';
        const origTitle = container.querySelector('.pane-meta-title');
        if (origTitle) origTitle.style.display = 'none';
        const origWrapper = container.querySelector('.chart-wrapper');
        if (origWrapper) origWrapper.style.display = 'none';
        charts.forEach(c => {
            container.insertAdjacentHTML('beforeend', `
                <div class="pane-meta-title">// ${c.title}</div>
                <div class="chart-wrapper"><canvas id="${c.canvasId}"></canvas></div>
            `);
        });
    },

    formulaBox(title, formula) {
        return `<div class="control-box" style="margin-top: 16px; padding: 12px; background: #f8fafc; border-radius: 8px; font-size: 0.85rem; line-height: 1.6; color: #334155;">
            <div style="font-weight: 700; margin-bottom: 6px;">${title}</div>
            <div>$$${formula}$$</div>
        </div>`;
    },

    typesetMath(element) {
        if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([element]);
    }
};

// =========================================================================
// 單擺實驗
// =========================================================================
function initPendulumShm() {
    const { canvas, ctx, ctrlPanel, guardEl } = PhysicsUtils.initCanvas();
    if (!canvas) return;

    const resizeCanvas = PhysicsUtils.setupResize(canvas);

    let length = 2.0, mass = 1.0, gravity = 9.8, initAngleDeg = 5;
    let angle, angVel, simTime, trail;
    let isRunning = false, isPaused = false;
    let lastTimestamp = performance.now();
    let animationFrameId, frameCount = 0;
    const state = { isRunning, isPaused, lastTimestamp };

    function resetState() {
        angle = initAngleDeg * Math.PI / 180;
        angVel = 0; simTime = 0; trail = [];
    }
    resetState();

    // 控制面板
    if (ctrlPanel) {
        ctrlPanel.innerHTML = `
            <div class="control-box">
                <label><span>擺長 <i>L</i></span><span style="font-family:monospace;font-weight:800"><span id="lVal" style="color:#2563eb">2.0</span> m</span></label>
                <input type="range" id="lSlider" min="0.5" max="4.0" step="0.1" value="2.0">
            </div>
            <div class="control-box">
                <label><span>質量 <i>m</i></span><span style="font-family:monospace;font-weight:800"><span id="mVal" style="color:#2563eb">1.0</span> kg</span></label>
                <input type="range" id="mSlider" min="0.5" max="5.0" step="0.1" value="1.0">
            </div>
            <div class="control-box">
                <label><span>重力加速度 <i>g</i></span><span style="font-family:monospace;font-weight:800"><span id="gVal" style="color:#2563eb">9.8</span> m/s²</span></label>
                <input type="range" id="gSlider" min="1.0" max="25.0" step="0.1" value="9.8">
            </div>
            <div class="control-box">
                <label><span>初始角度 <i>θ₀</i></span><span style="font-family:monospace;font-weight:800"><span id="a0Val" style="color:#2563eb">5</span>°</span></label>
                <input type="range" id="a0Slider" min="3" max="60" step="1" value="5">
            </div>
            <div class="control-box" style="padding:12px;background:#f8fafc;border-radius:8px;font-size:0.85rem;line-height:1.8;color:#334155">
                <div style="font-weight:700;margin-bottom:6px">單擺參數</div>
                <div style="font-family:monospace;font-size:0.8rem">
                    <div>角頻率 ω₀ = <span id="shmOmega" style="color:#2563eb;font-weight:800">2.21</span> rad/s</div>
                    <div>週期 T = <span id="shmT" style="color:#2563eb;font-weight:800">2.84</span> s</div>
                    <div>頻率 f = <span id="shmF" style="color:#2563eb;font-weight:800">0.35</span> Hz</div>
                </div>
            </div>
            <div class="control-box" style="margin-top:12px">
                <button id="startBtn">開始 START</button>
                <button id="pauseBtn">暫停 PAUSE</button>
                <button id="resetBtn">重設 RESET</button>
            </div>
            ${PhysicsUtils.formulaBox('單擺週期', 'T = 2\\pi\\sqrt{\\frac{L}{g}}')}
            ${PhysicsUtils.formulaBox('回復力', 'F = -mg\\sin\\theta')}
        `;
        PhysicsUtils.typesetMath(ctrlPanel);
        PhysicsUtils.bindSlider('lSlider', 'lVal', v => { length = v; updateSHMInfo(); });
        PhysicsUtils.bindSlider('mSlider', 'mVal', v => { mass = v; });
        PhysicsUtils.bindSlider('gSlider', 'gVal', v => { gravity = v; updateSHMInfo(); });
        PhysicsUtils.bindSlider('a0Slider', 'a0Val', v => { initAngleDeg = v; }, v => parseInt(v).toString());
        updateSHMInfo();
    }

    function updateSHMInfo() {
        const omega0 = Math.sqrt(gravity / length);
        const T = 2 * Math.PI / omega0, f = 1 / T;
        const el = id => document.getElementById(id);
        if (el('shmOmega')) el('shmOmega').textContent = omega0.toFixed(2);
        if (el('shmT')) el('shmT').textContent = T.toFixed(2);
        if (el('shmF')) el('shmF').textContent = f.toFixed(2);
    }

    // 數據面板
    const updateCards = PhysicsUtils.createDataCards([
        { label: '時間 TIME', id: 'cardTime', unit: 's', highlight: true },
        { label: '角度 θ', id: 'cardAngle', unit: '°' },
        { label: '回復力 F', id: 'cardF', unit: 'N' },
        { label: '角速度 ω', id: 'cardOmega', unit: 'rad/s' },
        { label: '週期 T', id: 'cardPeriod', unit: 's' },
    ]);

    // 圖表
    PhysicsUtils.prepareChartContainer('chartContainer', [
        { canvasId: 'thetaChart', title: 'ANGLE-TIME GRAPH' },
        { canvasId: 'energyChart', title: 'ENERGY BAR' },
    ]);

    const thetaChartObj = PhysicsUtils.createChart({
        canvasId: 'thetaChart', label: '角度 θ (°)', borderColor: '#2563eb',
        xTitle: '時間 t (s)', yTitle: '角度 θ (°)', maxPoints: 400
    });

    let energyChart = null;
    const initEnergy = mass * gravity * length * (1 - Math.cos(initAngleDeg * Math.PI / 180));
    const energyCanvas = document.getElementById('energyChart');
    if (energyCanvas && typeof Chart !== 'undefined') {
        energyChart = new Chart(energyCanvas, {
            type: 'bar',
            data: { labels: ['動能 KE', '位能 PE', '總能量 E'], datasets: [{ data: [0, 0, 0], backgroundColor: ['#22c55e', '#3b82f6', '#94a3b8'], borderColor: ['#16a34a', '#2563eb', '#64748b'], borderWidth: 1, barPercentage: 0.6 }] },
            options: { responsive: true, maintainAspectRatio: false, animation: false, indexAxis: 'y', scales: { x: { display: true, min: 0, max: initEnergy * 1.05 || 1, title: { display: true, text: '能量 (J)', font: { family: 'monospace', weight: '700' } }, ticks: { font: { family: 'monospace' } } }, y: { display: true, ticks: { font: { family: 'monospace', weight: '700', size: 12 } } } }, plugins: { legend: { display: false } } }
        });
    }

    // 物理計算
    const SCALE = 90;

    function physicsStep(dt) {
        const alpha = -(gravity / length) * Math.sin(angle);
        angVel += alpha * dt;
        angle += angVel * dt;
    }

    function getQuantities() {
        const F_restore = -mass * gravity * Math.sin(angle);
        const omega0 = Math.sqrt(gravity / length);
        const T = 2 * Math.PI / omega0;
        const KE = 0.5 * mass * length * length * angVel * angVel;
        const PE = mass * gravity * length * (1 - Math.cos(angle));
        return { F_restore, omega0, T, KE, PE };
    }

    // 渲染
    function drawSim() {
        const W = canvas.cssWidth, H = canvas.cssHeight;

        // 上半部：單擺
        const pendOx = W * 0.5, pendOy = H * 0.07;
        const maxLp = H * 0.42;
        const lp = Math.min(length * SCALE, maxLp);
        const ballX = pendOx + lp * Math.sin(angle);
        const ballY = pendOy + lp * Math.cos(angle);

        if (isRunning && !isPaused) { trail.push({ x: ballX, y: ballY }); if (trail.length > 180) trail.shift(); }

        // 天花板
        const cw = PhysicsUtils.scaled(100, W), ch = PhysicsUtils.scaled(10, W);
        const ceilGrad = ctx.createLinearGradient(pendOx - cw / 2, pendOy - ch, pendOx - cw / 2, pendOy);
        ceilGrad.addColorStop(0, '#a0845c'); ceilGrad.addColorStop(0.5, '#c9a96e'); ceilGrad.addColorStop(1, '#8b7355');
        ctx.fillStyle = ceilGrad; ctx.beginPath(); ctx.roundRect(pendOx - cw / 2, pendOy - ch, cw, ch, 3); ctx.fill();

        // 垂直參考虛線
        ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(pendOx, pendOy); ctx.lineTo(pendOx, pendOy + lp + 40); ctx.stroke(); ctx.restore();

        // 角度弧線
        if (Math.abs(angle) > 0.02) {
            const arcR = PhysicsUtils.scaled(40, W), s = Math.PI / 2, e = Math.PI / 2 - angle;
            ctx.beginPath(); ctx.arc(pendOx, pendOy, arcR, Math.min(s, e), Math.max(s, e));
            ctx.strokeStyle = 'rgba(37,99,235,0.4)'; ctx.lineWidth = 2; ctx.stroke();
            const mid = (s + e) / 2, tr = arcR + PhysicsUtils.scaled(12, W);
            PhysicsUtils.drawSafeText(ctx, (angle * 180 / Math.PI).toFixed(1) + '°',
                pendOx + tr * Math.cos(mid), pendOy + tr * Math.sin(mid), {
                    font: PhysicsUtils.FONTS.ANGLE, color: 'rgba(37,99,235,0.7)', W, H
                });
        }

        // 軌跡
        for (let i = 1; i < trail.length; i++) {
            const a = i / trail.length * 0.35;
            ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y);
            ctx.strokeStyle = `rgba(37,99,235,${a})`; ctx.lineWidth = 2; ctx.stroke();
        }

        // 擺線
        const stringGrad = ctx.createLinearGradient(pendOx, pendOy, ballX, ballY);
        stringGrad.addColorStop(0, '#555'); stringGrad.addColorStop(1, '#999');
        ctx.beginPath(); ctx.moveTo(pendOx, pendOy); ctx.lineTo(ballX, ballY);
        ctx.strokeStyle = stringGrad; ctx.lineWidth = 2.5; ctx.stroke();

        // 擺錘
        PhysicsUtils.drawBall(ctx, ballX, ballY, PhysicsUtils.scaled(20, W), '#2563eb');

        // 力的向量
        const F_LEN = PhysicsUtils.scaled(35, W);
        const mgLen = mass * gravity * F_LEN / 15;
        PhysicsUtils.drawArrow(ctx, ballX, ballY, ballX, ballY + mgLen, { color: '#64748b', width: 2, dashed: true, label: 'mg' });

        const Ft = -mass * gravity * Math.sin(angle);
        const ftLen = Math.abs(Ft) * F_LEN / 10;
        if (ftLen > 3) {
            const tangDx = Math.cos(angle), tangDy = -Math.sin(angle), s = Ft > 0 ? 1 : -1;
            PhysicsUtils.drawArrow(ctx, ballX, ballY, ballX + s * tangDx * ftLen, ballY + s * tangDy * ftLen, { color: '#ef4444', width: 3, shadow: true, label: 'F' });
        }

        // 下半部：彈簧振子對比
        const springOx = W * 0.5, springOy = H * 0.72, eqX = springOx;
        const omega0 = Math.sqrt(gravity / length);
        const shmX = length * angle;
        const springBallX = eqX + shmX * SCALE * 0.8;

        // 牆壁
        const wallX = springOx - PhysicsUtils.scaled(80, W), wallW = PhysicsUtils.scaled(14, W), wallH = PhysicsUtils.scaled(60, W);
        const wallGrad = ctx.createLinearGradient(wallX - wallW, 0, wallX, 0);
        wallGrad.addColorStop(0, '#a0845c'); wallGrad.addColorStop(0.5, '#c9a96e'); wallGrad.addColorStop(1, '#8b7355');
        ctx.fillStyle = wallGrad; ctx.fillRect(wallX - wallW, springOy - wallH / 2, wallW, wallH);

        // 彈簧
        drawSpring(ctx, wallX, springOy, springBallX - 16, springOy);

        // 平衡位置
        ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = 'rgba(139,92,246,0.25)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(eqX, springOy - 50); ctx.lineTo(eqX, springOy + 50); ctx.stroke(); ctx.restore();
        PhysicsUtils.drawSafeText(ctx, '平衡', eqX, springOy - PhysicsUtils.scaled(54, W), {
            font: PhysicsUtils.FONTS.SMALL, color: 'rgba(139,92,246,0.5)', align: 'center', W, H
        });

        // 彈簧振子球
        PhysicsUtils.drawBall(ctx, springBallX, springOy, PhysicsUtils.scaled(16, W), '#8b5cf6');

        // 位移標示
        const springDx = springBallX - eqX;
        if (Math.abs(springDx) > 5) {
            PhysicsUtils.drawArrow(ctx, eqX, springOy + 35, springBallX, springOy + 35, { color: '#8b5cf6', width: 2, label: 'x' });
        }

        // 圖例
        PhysicsUtils.drawLegend(ctx, [
            { color: '#2563eb', label: '單擺軌跡' },
            { color: '#ef4444', label: '回復力 F' },
            { color: '#8b5cf6', label: '彈簧振子' },
        ], W, H);
    }

    function drawSpring(ctx, x1, y1, x2, y2) {
        const len = Math.abs(x2 - x1);
        if (len < 10) return;
        const coils = 10, amp = PhysicsUtils.scaled(10, canvas.cssWidth), leadIn = PhysicsUtils.scaled(10, canvas.cssWidth), leadOut = PhysicsUtils.scaled(10, canvas.cssWidth);
        const springLen = len - leadIn - leadOut;
        ctx.save(); ctx.translate(x1, y1);
        const grad = ctx.createLinearGradient(0, 0, len, 0);
        grad.addColorStop(0, '#8b5cf6'); grad.addColorStop(0.5, '#a78bfa'); grad.addColorStop(1, '#8b5cf6');
        ctx.strokeStyle = grad; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(leadIn, 0);
        const segLen = springLen / (coils * 2);
        for (let i = 0; i < coils * 2; i++) {
            ctx.lineTo(leadIn + (i + 1) * segLen, (i % 2 === 0 ? -1 : 1) * amp);
        }
        ctx.lineTo(len, 0); ctx.stroke(); ctx.restore();
    }

    // 主迴圈
    function loop(ts) {
        if (!document.contains(guardEl)) return;
        let dt = (ts - lastTimestamp) / 1000;
        lastTimestamp = ts;
        if (dt > 0.1) dt = 0.1;

        if (isRunning && !isPaused) {
            const subSteps = 8, subDt = dt / subSteps;
            for (let i = 0; i < subSteps; i++) physicsStep(subDt);
            simTime += dt;
        }

        PhysicsUtils.beginFrame(ctx, canvas);
        drawSim();

        const q = getQuantities();
        updateCards({ cardTime: simTime.toFixed(2), cardAngle: (angle * 180 / Math.PI).toFixed(1), cardF: q.F_restore.toFixed(3), cardOmega: angVel.toFixed(3), cardPeriod: q.T.toFixed(3) });

        if (frameCount++ % 3 === 0 && isRunning && !isPaused) {
            if (thetaChartObj) thetaChartObj.pushData(simTime.toFixed(2), angle * 180 / Math.PI);
            if (energyChart) { energyChart.data.datasets[0].data = [q.KE, q.PE, q.KE + q.PE]; energyChart.update('none'); }
        }

        animationFrameId = requestAnimationFrame(loop);
    }

    // 按鈕事件
    PhysicsUtils.setupStartBtn('startBtn', 'pauseBtn', state, () => {
        isRunning = true; isPaused = false; resetState(); lastTimestamp = performance.now();
        if (thetaChartObj) thetaChartObj.clear();
        if (thetaChartObj && thetaChartObj.chart) {
            thetaChartObj.chart.options.scales.y.min = -initAngleDeg * 1.2;
            thetaChartObj.chart.options.scales.y.max = initAngleDeg * 1.2;
            thetaChartObj.chart.update('none');
        }
        if (energyChart) {
            const ie = mass * gravity * length * (1 - Math.cos(initAngleDeg * Math.PI / 180));
            energyChart.options.scales.x.max = ie * 1.05 || 1;
            energyChart.data.datasets[0].data = [0, 0, 0]; energyChart.update('none');
        }
    });

    PhysicsUtils.setupPauseBtn('pauseBtn', state, loop, paused => isPaused = paused);

    PhysicsUtils.setupResetBtn('resetBtn', () => {
        isRunning = false; isPaused = false; state.isRunning = false; state.isPaused = false; resetState();
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('pauseBtn').style.display = 'none';
        document.getElementById('pauseBtn').textContent = '暫停 PAUSE';
        document.getElementById('pauseBtn').style.backgroundColor = '#ffffff';
        document.getElementById('pauseBtn').style.color = '#000000';
        document.getElementById('pauseBtn').style.border = '1px solid #000000';
        updateCards({ cardTime: '0.00', cardAngle: initAngleDeg.toFixed(0), cardF: '0.000', cardOmega: '0.000', cardPeriod: getQuantities().T.toFixed(3) });
        if (thetaChartObj) thetaChartObj.clear();
        if (energyChart) { energyChart.data.datasets[0].data = [0, 0, 0]; energyChart.update(); }
    });

    lastTimestamp = performance.now();
    animationFrameId = requestAnimationFrame(loop);
    PhysicsUtils.setupCleanup(animationFrameId, resizeCanvas);
}

initPendulumShm();
</script>
