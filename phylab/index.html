    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');

    // 比對函數：支援多個關鍵字（空格分隔）
    function matchExperiment(exp, query) {
        const terms = query.split(/\s+/);
        const searchText = [exp.title, exp.description, exp.keywords].join(' ').toLowerCase();
        return terms.every(term => searchText.includes(term));
    }

    searchInput.addEventListener('input', function() {
        const query = this.value.trim().toLowerCase();

        if (!query) {
            searchResults.style.display = 'none';
            return;
        }

        const matches = allExperiments.filter(exp => matchExperiment(exp, query));

        if (matches.length === 0) {
            searchResults.style.display = 'block';
            searchResults.innerHTML = '<div class="no-result">找不到符合的實驗</div>';
        } else {
            searchResults.style.display = 'block';
            searchResults.innerHTML = matches.map(exp => `
                <a href="${exp.url}" class="search-result-item">
                    <span class="search-result-theme">${exp.theme}</span>
                    <span class="search-result-title">${exp.title}</span>
                </a>
            `).join('');
        }
    });

    // 點擊外部時關閉搜尋結果
    document.addEventListener('click', function(e) {
        if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
            searchResults.style.display = 'none';
        }
    });
</script>
